<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lynn Liu — Timeline Archive</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:"Helvetica Neue","PingFang SC",sans-serif;overflow-x:hidden;scroll-behavior:smooth}

/* Header */
header{
  position:fixed;top:0;left:0;right:0;
  padding:20px 40px;display:flex;justify-content:space-between;align-items:center;
  background:rgba(0,0,0,.35);backdrop-filter:blur(8px);z-index:1000;
}
header h1{font-weight:500;letter-spacing:2px}
nav a{color:#fff;text-decoration:none;margin-left:28px;opacity:.75;transition:opacity .3s}
nav a:hover{opacity:1}

/* Main timeline */
main{margin-top:100px;padding:0 40px 150px}
.timeline{position:relative;margin:auto;max-width:1200px}
.line{
  position:absolute;left:50%;top:0;bottom:0;width:2px;
  background: linear-gradient(to bottom, rgb(255, 255, 255), #333, rgb(255, 255, 255));
  box-shadow:0 0 10px rgba(0,255,255,.4);
}

/* Entry */
.entry{
  position:relative;width:50%;padding:80px 30px;opacity:0;transform:translateY(30px);
  transition:opacity 0.6s ease, transform 0.6s ease;
}
.entry.visible{opacity:1;transform:translateY(0);}
.entry:nth-child(odd){left:0;text-align:right}
.entry:nth-child(even){left:50%}

/* Dot */
.dot{
  position:absolute;top:140px;width:14px;height:14px;border-radius:50%;
  background:#ffffff;box-shadow:0 0 12px rgb(255, 255, 255);
}
.entry:nth-child(odd) .dot{right:-6px}
.entry:nth-child(even) .dot{left:-6px}

/* Text styles */
.year{
  font-family:monospace;font-size:14px;opacity:.45;margin-bottom:6px;letter-spacing:1px;
}
.title{
  font-size:26px;font-weight:600;margin-bottom:10px;text-shadow:0 2px 6px rgba(0,0,0,0.4);
}
.text{
  opacity:.7;line-height:1.6;max-width:320px;display:inline-block;
}

/* Media */
.media{
  margin-top:16px;width:400px;aspect-ratio:4/3;background:#111;overflow:hidden;
  position:relative;top:-5px;box-shadow:0 6px 20px rgba(0,0,0,0.5);border-radius:6px;
  transition:transform .5s;
}
.media img{
  width:100%;height:100%;object-fit:cover;transition:transform .5s, filter .5s;
}
.media:hover img{
  transform:scale(1.06);filter:brightness(1.1);
}

/* Link */
.open{
  margin-top:12px;font-size:13px;opacity:.6;display:inline-block;text-decoration:none;
  color:#fff;border-bottom:1px solid #888;transition:all .3s;
}
.open:hover{opacity:1;color:#fff;border-color:#0ff}

/* Responsive */
@media(max-width:900px){
  .line{left:20px}
  .entry,.entry:nth-child(even),.entry:nth-child(odd){
    left:0;width:100%;text-align:left;padding:80px 20px 80px 40px
  }
  .dot{left:13px}
  .media{width:100%;max-width:520px}
}
@media(max-width:600px){
  main{padding:0 20px}
  .entry{padding:60px 15px}
  .media{width:100%;max-width:100%}
}
</style>
</head>
<body>

<header>
  <h1>LYNN LIU</h1>
  <nav>
    <a href="../index.html">Works</a>
    <a href="../resume.html">Resume</a>
    <a href="../about.html">About</a>
  </nav>
</header>

<main>
  <div class="timeline" id="timeline">
    <div class="line"></div>
  </div>
</main>

<script>
// Data
const works=[
  {
    title:"Gen map",
    year:5.2024,
    img:"../assets/data5.jpg",
    url:"project7.html",
    text:"The body constructs belief the way scaffolding constructs height — temporarily, repeatedly, inevitably collapsing."
  },
  {
    title:"Star interview",
    year:2024,
    img:"../assets/data4.jpg",
    url:"project.html",
    text:"Particles behave like memory: only visible when illuminated at the right angle of time."
  },
  {
    title:"Big water guy",
    year:2025,
    img:"../assets/data2.jpg",
    url:"project.html",
    text:"The body constructs belief the way scaffolding constructs height — temporarily, repeatedly, inevitably collapsing."
  },
  {
    title:"Questionnaire Survey",
    year:12.2023,
    img:"../assets/data3.jpg",
    url:"survey_chart copy.html",
    text:"牙医调研数据补充文本描述"
  }
].sort((a,b)=>b.year-a.year);

const timeline=document.getElementById('timeline');

// Render timeline entries
works.forEach(w=>{
  const div=document.createElement('div');
  div.className='entry';
  div.innerHTML=`
    <div class="dot"></div>
    <div class="year">${w.year}</div>
    <div class="title">${w.title}</div>
    <div class="text">${w.text}</div>
    <div class="media"><img src="${w.img}"></div>
    <a class="open" href="${w.url}">enter project →</a>
  `;
  timeline.appendChild(div);
});

// Scroll reveal effect
const entries=document.querySelectorAll('.entry');
function revealEntries(){
  entries.forEach(e=>{
    const rect=e.getBoundingClientRect();
    if(rect.top<window.innerHeight-100){
      e.classList.add('visible');
    }
  });
}
window.addEventListener('scroll',revealEntries);
revealEntries();
</script>

</body>
</html>
